# =============================================================================
# config.yaml — 全域參數設定檔
# 所有模組共用此設定，修改此檔即可，無需動主程式。
# =============================================================================


# -----------------------------------------------------------------------------
# 資料目錄路徑常數
# -----------------------------------------------------------------------------
paths:
  # 資料根目錄（可使用相對或絕對路徑）
  SOURCE_VIDEO_DIR: ./dataset/中華三路_民生二路(東北角)yolo驗證用_all8/

  # TrackEval 輸出根目錄
  TRACKEVAL_OUT_DIR: trackeval_output

  # 第一、二階段統一輸出根目錄（與來源完全分開）
  OUTPUT_ROOT: ./runs/track_eval

  # DET 評估子目錄名稱（位於 base_dir 下）/   TRACK 評估子目錄名稱（位於 base_dir 下）
  # run_det_eval_dir: "annotations_all8(orign)"
  # run_track_eval_dir: "mot_annotations_all8(orign)"

  run_det_eval_dir: annotations_all8
  # run_det_eval_dir: annotations_all8(compasate)
  run_track_eval_dir: mot_annotations_all8



# -----------------------------------------------------------------------------
# 模型路徑
# -----------------------------------------------------------------------------
models:
  det_model_path:  ./models/yolo/yolo11x_dennis.pt

# -----------------------------------------------------------------------------
# TrackEval Dataset 設定
# -----------------------------------------------------------------------------
trackeval:
  benchmark_name: CCTV
  split_name:     val
  tracker_name:   YOLO11x


# -----------------------------------------------------------------------------
# 評估開關
# -----------------------------------------------------------------------------
eval_flags:
  run_det_eval:   false   # true / false
  run_track_eval: true    # true / false


# -----------------------------------------------------------------------------
# 要評估的類別（YOLO class id 為 0-based）
# -----------------------------------------------------------------------------
classes_to_run:
  person:      0
  car:         1
  scooter:     2
  small_truck: 3
  bus:         4
  truck:       5


# -----------------------------------------------------------------------------
# 偵測區域多邊形（像素座標，左上→右上→右下→左下）
# 設為 null 表示不啟用 crop 限制。
# -----------------------------------------------------------------------------
det_corner:
  - [210, 90]
  - [580, 100]
  - [640, 320]
  - [0,   280]

# det_corner: null 

# -----------------------------------------------------------------------------
# Log 輸出控制
#
#   verbose: true  → 顯示每個序列的詳細處理過程（路徑、GT fix 統計、類別物件數等）
#            false → 只保留關鍵進度訊息（序列名稱、最終 Excel 路徑）
#
#   debug:   false → 正常執行（建議維持 false）
#            true  → 額外印出 TrackEval 內部 tracker 檔案逐項檢查（md5、head、路徑）
#                    用於排查 tracker txt 格式或路徑問題
# -----------------------------------------------------------------------------
logging:
  verbose: false
  debug:   false

# -----------------------------------------------------------------------------
# tracking 與推論相關參數 (將與 CLI 參數對應)
# -----------------------------------------------------------------------------
tracking_params:
  tracker: bytetrack       # Tracker 類型，可選: 'botsort' 或 'bytetrack'
  conf:        0.15         # 信心門檻 (Detection confidence threshold)
  iou:         0.50         # IoU 門檻 (IoU threshold for track association)
  imgsz:       640          # 推論解析度 (Inference image size)
  frame_rate:  30           # 處理影片影格率 (Inference video frame rate)
  gmc_method:  ecc          # 運動補償方法 (BoTSORT/BYTETrack GMC method)
  # gmc_method 可選: 'none', 'sparseOptFlow', 'orb', 'sift', 'ecc'

# -----------------------------------------------------------------------------
# 影片儲存控制
# -----------------------------------------------------------------------------
save params:
  show: false               # 是否即時顯示畫面
  save: true                # 是否儲存標註影片 (儲存推論後的影片)
  save_txt: true            # 是否儲存 YOLO 風格的 label txt
  show_unmatched: false     # 是否在影片/可視化中額外標示未匹配的 detection (顯示 tracking 失敗的框)
  show_removed: false       # 是否顯示已移除的軌跡 (如閾值關係移除的目標)


# -----------------------------------------------------------------------------
# Class-aware tracker 逐類別參數表
# 原本是 module/tracker/track_config_ByteTrack_0411.yaml（track_eval.py 實際使用的預設版），
# 2026-07-23 合併進本檔，維持與合併前完全相同的 tracking 行為。
# 由 module/tracker/config.py::load_track_config() 讀取。
#
# 不指定 --track-config 時，CLI 直接用這個章節當作 tracking 設定。
# 若要套用其他實驗版本，用 --track-config 指向 module/tracker/track_config_*.yaml
# 其中一個變體（含 track_config.yaml 這個較完整的 base 版、BotSort_0413、
# BotSort_noreid_0413、new），該檔案內容會整份取代這個章節，不會跟這裡的值合併。
#
# ⚠️ 這個章節刻意不含 use_reid / appearance_thresh / model / track_buffer 等欄位
# （ByteTrack 不用 ReID/GMC，per-class track_buffer 未指定時會回落全域預設 120）。
# 若要套用含 ReID 的完整參數表（如跑 BoTSORT），改用 --track-config 指定
# module/tracker/track_config.yaml 或其他變體，不要直接在這裡加欄位。
# -----------------------------------------------------------------------------
class_tracking:
  class_names:
    0: person
    1: car
    2: scooter
    3: small_truck
    4: bus
    5: truck

  # 各類別追蹤參數（鍵為類別英文名，與 class_names 值一致）
  class_tracking_params:
    car:
      center_dist_weight: 0.4
      fuse_score: true
      match_thresh: 0.7
      new_track_thresh: 0.25
      norm_factor: 80.0
      second_match_thresh: 0.6
      unconfirmed_match_thresh: 0.9
    bus:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.7
      norm_factor: 200.0
      new_track_thresh: 0.15
      second_match_thresh: 0.55
      unconfirmed_match_thresh: 0.95
    small_truck:
      center_dist_weight: 0.2
      fuse_score: true
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
    truck:
      center_dist_weight: 0.2
      fuse_score: false
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
    person:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.9
      new_track_thresh: 0.25
      norm_factor: 150.0
      second_match_thresh: 0.5
      unconfirmed_match_thresh: 0.85
    scooter:
      center_dist_weight: 0.25
      fuse_score: true
      match_thresh: 0.9
      new_track_thresh: 0.1
      norm_factor: 200.0
      second_match_thresh: 0.4
      unconfirmed_match_thresh: 0.8

  default_tracking_params:
    match_thresh: 0.80
    appearance_thresh: 0.35
    new_track_thresh: 0.15
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    use_reid: false

  class_conf_thresh:
    person: 0.15
    car: 0.15
    scooter: 0.10
    small_truck: 0.15
    bus: 0.15
    truck: 0.15

  default_conf_thresh: 0.15

