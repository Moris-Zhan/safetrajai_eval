paths:
  dataset: cctv_all8
  TRACKEVAL_OUT_DIR: trackeval_output
  OUTPUT_ROOT: /mnt/moris/Dcoker_Project/Project/safetrajai_eval/runs/reid_domain/accept/reid_car/tune
  SOURCE_VIDEO_DIR: ./dataset/eval/cctv_all8_subsets/tune/
models:
  det_model_path: ./models/yolo/yolo11x_dennis.pt
trackeval:
  benchmark_name: CCTV
  split_name: val
  tracker_name: YOLO11x
stages:
  run_stage1: true
  run_stage2: true
eval_flags:
  run_det_eval: false
  run_track_eval: true
classes_to_run:
  person: 0
  car: 1
  scooter: 2
  small_truck: 3
  bus: 4
  truck: 5
logging:
  verbose: false
  debug: false
tracking_params:
  tracker: botsort
  conf: 0.15
  iou: 0.5
  imgsz: 640
  frame_rate: auto
  gmc_method: sparseOptFlow
save params:
  show: false
  save: false
  save_txt: true
  show_unmatched: false
  show_removed: false
  save_reid_crops: false
  reid_crop_dir: ./dataset/reid/crops
class_tracking:
  class_names:
    0: person
    1: car
    2: scooter
    3: small_truck
    4: bus
    5: truck
  class_tracking_params:
    car:
      center_dist_weight: 0.6
      fuse_score: true
      match_thresh: 0.7
      new_track_thresh: 0.25
      norm_factor: 80.0
      second_match_thresh: 0.6
      unconfirmed_match_thresh: 0.9
      use_reid: true
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/class_reid_weights/dinov2s_v3/model.pt
      track_buffer: 15
    bus:
      center_dist_weight: 0.4
      fuse_score: false
      match_thresh: 0.7
      norm_factor: 200.0
      new_track_thresh: 0.15
      second_match_thresh: 0.55
      unconfirmed_match_thresh: 0.95
      use_reid: false
      proximity_thresh: 0.1
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
      track_buffer: 15
    small_truck:
      center_dist_weight: 0.4
      fuse_score: true
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 15
    truck:
      center_dist_weight: 0.4
      fuse_score: false
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.6
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 15
    person:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.9
      new_track_thresh: 0.25
      norm_factor: 150.0
      second_match_thresh: 0.5
      unconfirmed_match_thresh: 0.85
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.3
      model: models/yolo/yolo11x.pt
      track_buffer: 10
    scooter:
      center_dist_weight: 0.25
      fuse_score: true
      match_thresh: 0.9
      new_track_thresh: 0.1
      norm_factor: 200.0
      second_match_thresh: 0.4
      unconfirmed_match_thresh: 0.8
      use_reid: false
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 10
  default_tracking_params:
    match_thresh: 0.8
    appearance_thresh: 0.35
    new_track_thresh: 0.15
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    use_reid: false
    model: ./yolo11x-cls-reid.pt
  class_conf_thresh:
    person: 0.15
    car: 0.15
    scooter: 0.1
    small_truck: 0.15
    bus: 0.15
    truck: 0.15
  default_conf_thresh: 0.15
