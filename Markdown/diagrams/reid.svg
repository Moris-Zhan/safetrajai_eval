<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reid-title reid-desc" id="reid-root">
        <title id="reid-title">reid/ 模組架構圖</title>
        <desc id="reid-desc">訓練端從資料品質工具把關的 manifest 出發，打包本機快取、訓練骨幹＋BNNeck，產出 model.pt；推論端的 Custom_ReID 載入這個權重檔，兩端共用同一個 letterbox 裁切工具；另一條 ReID（YOLO 當 encoder）路徑與訓練完全獨立；model.pt 另外送進外觀分離度關卡量測，但這個關卡的結果不代表追蹤效果會改善。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #reid-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #reid-root { font-family: var(--font-sans); color: var(--color-ink); }
      #reid-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#reid-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="reid-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="reid-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ZONES ================= -->
        <rect x="40" y="160" width="560" height="460" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="48" y="164" width="140" height="14" rx="2" fill="#f5f5f5"/>
        <text x="118" y="174" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">訓練（training/）</text>

        <rect x="620" y="160" width="260" height="240" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="628" y="164" width="120" height="14" rx="2" fill="#f5f5f5"/>
        <text x="688" y="174" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">推論（inference）</text>

        <!-- ================= ARROWS (behind nodes) ================= -->

        <!-- QA1 -> TR1 -->
        <line x1="180" y1="112" x2="180" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reid-arrow)"/>

        <!-- TR1 -> TR2 -->
        <line x1="180" y1="260" x2="180" y2="308" stroke="#4f5d75" stroke-width="1" marker-end="url(#reid-arrow)"/>

        <!-- TR2 -> TR4 -->
        <path d="M 180,372 V 396 Q 180,404 188,404 H 280 Q 288,404 288,412 V 420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#reid-arrow)"/>

        <!-- TR3 -> TR4 -->
        <path d="M 460,260 V 396 Q 460,404 452,404 H 360 Q 352,404 352,412 V 420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#reid-arrow)"/>

        <!-- TR4 -> TR5 -->
        <path d="M 288,484 V 508 Q 288,516 280,516 H 188 Q 180,516 180,524 V 532" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#reid-arrow)"/>

        <!-- TR4 -> TR6 -->
        <path d="M 352,484 V 508 Q 352,516 360,516 H 452 Q 460,516 460,524 V 532" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#reid-arrow-accent)"/>

        <!-- TR6 -> IN2 (dashed, LOAD) -->
        <path d="M 560,552 H 608 Q 616,552 616,544 V 348 Q 616,340 624,340 H 660" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reid-arrow)"/>
        <rect x="596" y="432" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="441" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOAD</text>

        <!-- TR6 -> GATE1 (MEASURE) -->
        <path d="M 560,576 H 800 Q 808,576 808,568 V 488 Q 808,480 816,480 H 920" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#reid-arrow)"/>
        <rect x="754" y="558" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="567" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">MEASURE</text>

        <!-- IN2 -> SHARED1 (UTIL) -->
        <line x1="770" y1="372" x2="770" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reid-arrow)"/>
        <rect x="746" y="456" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="770" y="465" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UTIL</text>

        <!-- ================= NODES ================= -->

        <!-- QA1: 資料品質工具 (outside zone) -->
        <rect x="80" y="48" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="180" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">資料品質工具</text>
        <text x="180" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contamination・exclusion</text>

        <!-- TR1: Manifest 資料集 -->
        <rect x="80" y="196" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Manifest 資料集</text>
        <text x="180" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">build_manifest()</text>

        <!-- TR3: 骨幹＋BNNeck -->
        <rect x="360" y="196" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">骨幹＋BNNeck</text>
        <text x="460" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DINOv2 ViT-S/14</text>

        <!-- TR2: 本機快取打包 -->
        <rect x="80" y="308" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">本機快取打包</text>
        <text x="180" y="353" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pack_manifest.py</text>

        <!-- TR4: PK 取樣＋訓練 -->
        <rect x="220" y="420" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">PK 取樣＋訓練</text>
        <text x="320" y="465" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">train.py（CE＋三元組）</text>

        <!-- TR5: val 評估 -->
        <rect x="80" y="532" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">val 評估</text>
        <text x="180" y="577" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evaluate.py</text>

        <!-- TR6: model.pt 權重 (focal) -->
        <rect x="360" y="532" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="368" y="540" width="52" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="394" y="549" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WEIGHT</text>
        <text x="460" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">model.pt 權重</text>
        <text x="460" y="577" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">safetrajai-reid-v1</text>

        <!-- IN1: ReID（YOLO encoder，獨立） -->
        <rect x="660" y="196" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="770" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">ReID（YOLO encoder）</text>
        <text x="770" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">embed 層・獨立路徑</text>

        <!-- IN2: Custom_ReID -->
        <rect x="660" y="308" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="770" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Custom_ReID</text>
        <text x="770" y="353" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">雙格式（state_dict／pickle）</text>

        <!-- SHARED1: DINOv2 letterbox (outside zone, shared util) -->
        <rect x="660" y="560" width="220" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="770" y="590" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">DINOv2 letterbox</text>
        <text x="770" y="605" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dinov2_features.py</text>

        <!-- GATE1: 外觀分離度關卡 (outside zone, bridging) -->
        <rect x="920" y="448" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="1020" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">外觀分離度關卡</text>
        <text x="1020" y="493" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fusion_stats.py</text>

        <!-- ================= LEGEND ================= -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="676" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">焦點（訓練輸出的權重檔）</text>

        <rect x="340" y="676" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">處理步驟</text>

        <rect x="540" y="676" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="560" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">zone 外（上游／共用／量測）</text>

        <line x1="880" y1="680" x2="904" y2="680" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reid-arrow)"/>
        <text x="912" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">載入／量測／共用（虛線）</text>
      </svg>
