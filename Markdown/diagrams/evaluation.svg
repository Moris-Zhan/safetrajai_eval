<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evaluation-title evaluation-desc" id="evaluation-root">
        <title id="evaluation-title">evaluation/ 模組流程圖</title>
        <desc id="evaluation-desc">evaluation/pipeline.py 的序列探索同時觸發兩條評估鏈：TRK 軌跡評估（GT shadow 準備→忽略區域套用→TrackEval 評估→Excel 合併）讀 stage1 的追蹤輸出；DET 偵測評估（建立評估資料集→YOLO 驗證→Excel 輸出）只用人工 GT，不讀追蹤標籤。兩條鏈互不相依，各自輸出到同一份 Excel 報表。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #evaluation-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #evaluation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #evaluation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#evaluation-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="evaluation-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="evaluation-arrow"        markerWidth="8" markerHeight="6" refX="7" refY="3"   orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="evaluation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3"   orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="evaluation-arrow-sm"     markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#evaluation-dots)" opacity="0.55"/>

        <!-- lane tint (DET lane, odd index) -->
        <rect x="140" y="116" width="588" height="80" fill="#2d3142" fill-opacity="0.018"/>

        <!-- lane dividers -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <!-- label column divider -->
        <line x1="140" y1="36" x2="140" y2="196" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>

        <!-- ================= STEP HEADER ================= -->
        <rect x="190" y="8" width="16" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/>
        <text x="198" y="19" fill="#2d3142" font-size="8" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">1</text>
        <text x="198" y="32" fill="#4f5d75" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle" font-family="'Geist Mono', monospace">探索</text>

        <rect x="302" y="8" width="16" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/>
        <text x="310" y="19" fill="#2d3142" font-size="8" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">2</text>
        <text x="310" y="32" fill="#4f5d75" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle" font-family="'Geist Mono', monospace">準備</text>

        <rect x="414" y="8" width="16" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/>
        <text x="422" y="19" fill="#2d3142" font-size="8" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">3</text>
        <text x="422" y="32" fill="#4f5d75" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle" font-family="'Geist Mono', monospace">前處理</text>

        <rect x="526" y="8" width="16" height="16" rx="8" fill="#bf4520" fill-opacity="0.20"/>
        <text x="534" y="19" fill="#bf4520" font-size="8" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">4</text>
        <text x="534" y="32" fill="#bf4520" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle" font-family="'Geist Mono', monospace">評估</text>

        <rect x="638" y="8" width="16" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/>
        <text x="646" y="19" fill="#2d3142" font-size="8" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">5</text>
        <text x="646" y="32" fill="#4f5d75" font-size="6" font-weight="500" letter-spacing="0.12em" text-anchor="middle" font-family="'Geist Mono', monospace">輸出</text>

        <!-- ================= LANE LABELS ================= -->
        <text x="70" y="72" fill="#4f5d75" font-size="8" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">軌跡</text>
        <text x="70" y="80" fill="#4f5d75" font-size="8" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">評估</text>
        <text x="70" y="152" fill="#4f5d75" font-size="8" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">偵測</text>
        <text x="70" y="160" fill="#4f5d75" font-size="8" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">評估</text>

        <!-- ================= ARROWS (behind nodes) ================= -->

        <!-- root -> TRK col1 (normal, same lane) -->
        <line x1="198" y1="76" x2="252" y2="76" stroke="#4f5d75" stroke-width="1" marker-end="url(#evaluation-arrow)"/>

        <!-- root -> DET col1 (trigger, dashed) -->
        <path d="M 198,76 H 302 Q 310,76 310,84 V 124" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#evaluation-arrow-sm)"/>

        <!-- TRK col1 -> col2 -->
        <line x1="310" y1="76" x2="364" y2="76" stroke="#4f5d75" stroke-width="1" marker-end="url(#evaluation-arrow)"/>

        <!-- TRK col2 -> col3 (focal-in) -->
        <line x1="422" y1="76" x2="476" y2="76" stroke="#bf4520" stroke-width="1.2" marker-end="url(#evaluation-arrow-accent)"/>

        <!-- TRK col3 -> col4 (focal-out) -->
        <line x1="534" y1="76" x2="588" y2="76" stroke="#bf4520" stroke-width="1.2" marker-end="url(#evaluation-arrow-accent)"/>

        <!-- DET col1 -> col3 (same lane, skips empty col2) -->
        <line x1="310" y1="156" x2="476" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#evaluation-arrow)"/>

        <!-- DET col3 -> col4 -->
        <line x1="534" y1="156" x2="588" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#evaluation-arrow)"/>

        <!-- ================= NODES ================= -->

        <!-- TRK col0: 序列探索 -->
        <rect x="148" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="152" y="48" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="165" y="56" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">TRK</text>
        <text x="198" y="74" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">序列探索</text>
        <text x="198" y="88" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">→ 序列清單</text>

        <!-- TRK col1: GT 準備 -->
        <rect x="260" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="48" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="277" y="56" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">TRK</text>
        <text x="310" y="74" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">GT 準備</text>
        <text x="310" y="88" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">prepare_gt_shadow()</text>

        <!-- TRK col2: 忽略區域 -->
        <rect x="372" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="48" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="389" y="56" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">TRK</text>
        <text x="422" y="74" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">忽略區域</text>
        <text x="422" y="88" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">apply_ignore_region()</text>

        <!-- TRK col3: TrackEval (focal node) -->
        <rect x="484" y="44" width="100" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="488" y="48" width="26" height="10" rx="2" fill="none" stroke="#bf4520" stroke-width="0.6" stroke-opacity="0.55"/>
        <text x="501" y="56" fill="#bf4520" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">TRK</text>
        <text x="534" y="74" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">TrackEval</text>
        <text x="534" y="88" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">Evaluator.evaluate()</text>

        <!-- TRK col4: Excel 合併 -->
        <rect x="596" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="600" y="48" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="613" y="56" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">TRK</text>
        <text x="646" y="74" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">Excel 合併</text>
        <text x="646" y="88" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">export_results()</text>

        <!-- DET col1: DET 資料集 -->
        <rect x="260" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="128" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="277" y="136" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">DET</text>
        <text x="310" y="154" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">DET 資料集</text>
        <text x="310" y="168" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">build_det_dataset()</text>

        <!-- DET col3: YOLO 驗證 -->
        <rect x="484" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="128" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="501" y="136" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">DET</text>
        <text x="534" y="154" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">YOLO 驗證</text>
        <text x="534" y="168" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">det_model.val()</text>

        <!-- DET col4: DET 輸出 -->
        <rect x="596" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="600" y="128" width="26" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.6" stroke-opacity="0.40"/>
        <text x="613" y="136" fill="#2d3142" font-size="6" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">DET</text>
        <text x="646" y="154" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans TC',sans-serif">DET 輸出</text>
        <text x="646" y="168" fill="#4f5d75" font-size="6.5" text-anchor="middle" font-family="'Geist Mono', monospace">export_metrics()</text>

        <!-- ================= LEGEND ================= -->
        <text x="12" y="212" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FLOW</text>

        <line x1="12" y1="228" x2="36" y2="228" stroke="#4f5d75" stroke-width="1" marker-end="url(#evaluation-arrow)"/>
        <text x="44" y="231" fill="#2d3142" font-size="9" font-family="'Geist','Noto Sans TC',sans-serif">一般交接</text>

        <line x1="160" y1="228" x2="184" y2="228" stroke="#bf4520" stroke-width="1.2" marker-end="url(#evaluation-arrow-accent)"/>
        <text x="192" y="231" fill="#2d3142" font-size="9" font-family="'Geist','Noto Sans TC',sans-serif">進出焦點步驟</text>

        <line x1="340" y1="228" x2="364" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#evaluation-arrow-sm)"/>
        <text x="372" y="231" fill="#2d3142" font-size="9" font-family="'Geist','Noto Sans TC',sans-serif">觸發（跨鏈）</text>

        <rect x="520" y="222" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="540" y="231" fill="#2d3142" font-size="9" font-family="'Geist','Noto Sans TC',sans-serif">焦點節點（TrackEval 引擎）</text>
      </svg>
