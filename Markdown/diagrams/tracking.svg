<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracking-title tracking-desc" id="tracking-root">
        <title id="tracking-title">tracking/ 模組流程圖</title>
        <desc id="tracking-desc">class-aware ByteTrack／BoTSORT 的三階段匈牙利匹配：Stage1 高信心偵測匹配、Stage2 低信心偵測匹配（標準 IoU）、Stage3 unconfirmed track 匹配，三階段都由逐類別查表取得各自門檻。未配對的偵測進入新增track判斷；未配對的 track 依 confirmed／unconfirmed 分別進入 Lost 存活判斷或直接淘汰，最後狀態合併。NEW 標籤代表本專案新增、取代 ultralytics 原生邏輯的部分。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #tracking-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tracking-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tracking-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tracking-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tracking-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="tracking-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ARROWS (behind nodes) ================= -->

        <!-- main spine -->
        <line x1="640" y1="104" x2="640" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>
        <line x1="640" y1="204" x2="640" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>
        <line x1="640" y1="304" x2="640" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>

        <!-- Stage3 -> 新增track (left branch) -->
        <path d="M 596,404 V 436 Q 596,444 588,444 H 384 Q 376,444 376,452 V 468" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>

        <!-- Stage3 -> diamond top vertex (right branch) -->
        <path d="M 684,404 V 416 Q 684,424 692,424 H 896 Q 904,424 904,432 V 436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>

        <!-- diamond Yes (right) -> Lost 判斷 -->
        <line x1="1004" y1="500" x2="1040" y2="500" stroke="#bf4520" stroke-width="1.2" marker-end="url(#tracking-arrow-accent)"/>
        <rect x="986" y="480" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1032" y="489" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">confirmed</text>

        <!-- diamond No (bottom) -> 狀態合併 -->
        <path d="M 904,564 V 580 Q 904,588 896,588 H 688 Q 680,588 680,596 V 600" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tracking-arrow)"/>
        <rect x="748" y="566" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="804" y="575" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">unconfirmed→removed</text>

        <!-- 新增track -> 狀態合併 -->
        <path d="M 376,532 V 568 Q 376,576 384,576 H 552 Q 560,576 560,584 V 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>

        <!-- Lost 判斷 -> 狀態合併 -->
        <path d="M 1140,532 V 568 Q 1140,576 1132,576 H 728 Q 720,576 720,584 V 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tracking-arrow)"/>

        <!-- 逐類別查表 (dashed, side supply) -->
        <path d="M 352,261 H 480 Q 488,261 488,253 V 196 H 508" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tracking-arrow)"/>
        <path d="M 352,283 H 480 Q 488,283 488,291 V 348 H 508" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tracking-arrow)"/>

        <!-- ================= NODES ================= -->

        <!-- N1: start oval -->
        <rect x="508" y="48" width="264" height="56" rx="28" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="640" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">偵測結果＋現有 tracks</text>
        <text x="640" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">每幀輸入</text>

        <!-- N2: Stage1 (NEW) -->
        <rect x="508" y="140" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="516" y="148" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="534" y="157" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="640" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Stage1：高信心匹配</text>
        <text x="640" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get_dists_class_aware()</text>

        <!-- N3: Stage2 (IOU) -->
        <rect x="508" y="240" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="516" y="248" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="532" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IOU</text>
        <text x="640" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Stage2：低信心匹配</text>
        <text x="640" y="293" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">iou_distance（未配對 track）</text>

        <!-- N4: Stage3 (NEW) -->
        <rect x="508" y="340" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="516" y="348" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="534" y="357" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="640" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Stage3：unconfirmed 匹配</text>
        <text x="640" y="393" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get_dists_class_aware()</text>

        <!-- N8: 逐類別查表 (NEW, side supply) -->
        <rect x="120" y="240" width="232" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.30"/>
        <rect x="128" y="248" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="146" y="257" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="236" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">逐類別查表</text>
        <text x="236" y="293" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get_params_for_class()</text>

        <!-- N5: 新增track -->
        <rect x="260" y="468" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="476" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="280" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="376" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">新增 track</text>
        <text x="376" y="521" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new_track_thresh（逐類別）</text>

        <!-- N6: diamond decision -->
        <polygon points="904,436 1004,500 904,564 804,500" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="904" y="494" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">未配對 track</text>
        <text x="904" y="510" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">confirmed？</text>

        <!-- N7: Lost 存活判斷 -->
        <rect x="1040" y="468" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1140" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Lost 存活判斷</text>
        <text x="1140" y="515" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">track_buffer（幀，逐類別）</text>

        <!-- N9: end oval 狀態合併 -->
        <rect x="508" y="600" width="264" height="56" rx="28" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="640" y="624" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">狀態合併</text>
        <text x="640" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remove_duplicate_stracks()</text>

        <!-- ================= LEGEND ================= -->
        <line x1="40" y1="672" x2="1240" y2="672" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <rect x="40" y="684" width="14" height="10" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="60" y="693" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">NEW（本專案新增，取代原生邏輯）</text>

        <rect x="400" y="684" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="420" y="693" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">決策（◇）</text>

        <rect x="620" y="684" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="693" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">處理步驟</text>

        <rect x="860" y="684" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.30"/>
        <text x="880" y="693" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">查表／終止路徑（虛線）</text>
      </svg>
