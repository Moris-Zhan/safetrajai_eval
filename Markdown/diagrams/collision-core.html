<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>collision/ 核心架構圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · collision/ 核心</p>
    <h1>stage3 核心：TTC／PET 衝突事件偵測＋Homography</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collision-core-title collision-core-desc">
        <title id="collision-core-title">collision/ 核心架構圖</title>
        <desc id="collision-core-desc">只讀 stage1 的 MOT 軌跡。有既有 Homography 矩陣或人工對應點時，先解析矩陣並附加轉換後座標；沒有時直接以 CCTV 像素座標進入 TTC/PET 核心運算。運算完成後把事件座標反投影回 CCTV 像素，輸出 ttc_events／pet_events，選用輸出熱區圖。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ARROWS (behind nodes) ================= -->

        <!-- 1 -> 2 -->
        <line x1="640" y1="112" x2="640" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2 -> 3 (有 H branch) -->
        <line x1="772" y1="168" x2="860" y2="168" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="786" y="150" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="816" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">有 H</text>

        <!-- 3 -> 4 -->
        <line x1="976" y1="200" x2="976" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 4 -> 5 merge (有 H path) -->
        <path d="M 976,288 V 296 Q 976,304 968,304 H 692 Q 684,304 684,312" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 2 -> 5 direct (無 H path) -->
        <line x1="596" y1="200" x2="596" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="556" y="246" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="586" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">無 H</text>

        <!-- 5 -> 6 -->
        <line x1="640" y1="376" x2="640" y2="400" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- 6 -> 7 -->
        <line x1="640" y1="464" x2="640" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7 -> 8 (optional, dashed) -->
        <line x1="772" y1="520" x2="860" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ================= NODES ================= -->

        <!-- 1: MOT 軌跡輸入 (input) -->
        <rect x="508" y="48" width="264" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="516" y="56" width="24" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="528" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="640" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">MOT 軌跡輸入</text>
        <text x="640" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trackers/*.txt（7 欄）</text>

        <!-- 2: 軌跡轉換 -->
        <rect x="508" y="136" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">軌跡轉換</text>
        <text x="640" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">load_sequence_tracks()</text>

        <!-- 3: Homography 解析 -->
        <rect x="860" y="136" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="868" y="144" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="890" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOMO</text>
        <text x="976" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Homography 解析</text>
        <text x="976" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolve_camera_homography()</text>

        <!-- 4: Homography 欄位附加 -->
        <rect x="860" y="224" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="868" y="232" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="890" y="241" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOMO</text>
        <text x="976" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Homography 欄位附加</text>
        <text x="976" y="269" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">add_homography_fields()</text>

        <!-- 5: TTC/PET 核心運算 (focal) -->
        <rect x="508" y="312" width="264" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="516" y="320" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="538" y="329" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CORE</text>
        <text x="640" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">TTC／PET 核心運算</text>
        <text x="640" y="365" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">detection_core.py</text>

        <!-- 6: 反投影 -->
        <rect x="508" y="400" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">反投影</text>
        <text x="640" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">invert_homography()</text>

        <!-- 7: 事件輸出 -->
        <rect x="508" y="488" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">事件輸出</text>
        <text x="640" y="533" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ttc_events／pet_events</text>

        <!-- 8: 熱區圖 (optional, dashed) -->
        <rect x="860" y="488" width="232" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="868" y="496" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="884" y="505" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPT</text>
        <text x="976" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">熱區圖</text>
        <text x="976" y="533" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">draw_collision_heatmap()</text>

        <!-- ================= LEGEND ================= -->
        <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="628" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="60" y="637" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">輸入（stage1 軌跡）</text>

        <rect x="300" y="628" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="320" y="637" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">焦點（TTC／PET 核心）</text>

        <rect x="580" y="628" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="637" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">處理步驟（含 Homography 分支）</text>

        <rect x="900" y="628" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="920" y="637" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">選用輸出</text>
      </svg>
    </div>
  </div>
</body>
</html>
