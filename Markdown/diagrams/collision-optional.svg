<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collision-opt-title collision-opt-desc" id="collision-optional-root">
        <title id="collision-opt-title">collision/ 選用輸出架構圖</title>
        <desc id="collision-opt-desc">計數線統計不依賴 Homography，直接用 CCTV 像素座標；衝突指標分析只在有 m/px 換算的 4 個鏡頭計算，核心指標完成後才視開關產生鳥瞰影片與盲區分析，盲區分析的遮蔽陰影會疊進鳥瞰影片。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #collision-optional-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #collision-optional-root { font-family: var(--font-sans); color: var(--color-ink); }
      #collision-optional-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#collision-optional-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="collision-optional-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="collision-optional-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ZONES ================= -->
        <rect x="40" y="160" width="500" height="360" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="48" y="164" width="120" height="14" rx="2" fill="#f5f5f5"/>
        <text x="108" y="174" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">計數線統計</text>

        <rect x="580" y="160" width="600" height="460" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="588" y="164" width="140" height="14" rx="2" fill="#f5f5f5"/>
        <text x="658" y="174" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">衝突指標分析</text>

        <!-- ================= ARROWS (behind nodes) ================= -->

        <!-- N0 -> N2 (into zone1, routed down left margin to avoid N1) -->
        <path d="M 596,112 V 140 Q 596,148 588,148 H 56 Q 48,148 48,156 V 340 H 72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#collision-optional-arrow)"/>

        <!-- N0 -> N4 -->
        <path d="M 684,112 V 140 Q 684,148 692,148 H 722 Q 730,148 730,156 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#collision-optional-arrow)"/>

        <!-- N1 -> N2 -->
        <line x1="172" y1="260" x2="172" y2="308" stroke="#4f5d75" stroke-width="1" marker-end="url(#collision-optional-arrow)"/>

        <!-- N2 -> N3 -->
        <line x1="172" y1="372" x2="172" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#collision-optional-arrow)"/>

        <!-- N4 -> N5 -->
        <line x1="730" y1="260" x2="730" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#collision-optional-arrow)"/>

        <!-- N5 -> N6 -->
        <line x1="730" y1="372" x2="730" y2="420" stroke="#bf4520" stroke-width="1.2" marker-end="url(#collision-optional-arrow-accent)"/>

        <!-- N5 -> N7 (dashed, bev) -->
        <path d="M 840,340 H 980 Q 988,340 988,348 V 532" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#collision-optional-arrow)"/>
        <rect x="954" y="380" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="992" y="389" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IF ENABLED</text>

        <!-- N5 -> N8 (dashed, blind_area, routed around N6) -->
        <path d="M 620,352 H 568 Q 560,352 560,360 V 552 Q 560,560 568,560 H 620" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#collision-optional-arrow)"/>
        <rect x="478" y="440" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="516" y="449" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IF ENABLED</text>

        <!-- N8 -> N7 (dashed, shadows) -->
        <line x1="840" y1="560" x2="900" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#collision-optional-arrow)"/>
        <rect x="844" y="542" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="872" y="551" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SHADOWS</text>

        <!-- ================= NODES ================= -->

        <!-- N0: stage1 MOT 軌跡 (input) -->
        <rect x="508" y="48" width="264" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="516" y="56" width="24" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="528" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="640" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">stage1 MOT 軌跡</text>
        <text x="640" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trackers/*.txt</text>

        <!-- N1: 計數線設定 -->
        <rect x="72" y="196" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="80" y="204" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="94" y="213" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CFG</text>
        <text x="172" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">計數線設定</text>
        <text x="172" y="249" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">counting_lines/&lt;cam&gt;.yaml</text>

        <!-- N2: 穿越偵測 -->
        <rect x="72" y="308" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="172" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">穿越偵測</text>
        <text x="172" y="353" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_counting_for_sequence()</text>

        <!-- N3: 計數輸出 -->
        <rect x="72" y="420" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="172" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">計數輸出</text>
        <text x="172" y="465" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">counts.csv／summary.json</text>

        <!-- N4: Homography＋門檻 -->
        <rect x="620" y="196" width="220" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="628" y="204" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="650" y="213" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOMO</text>
        <text x="730" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">Homography＋門檻</text>
        <text x="730" y="249" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">僅 4 鏡頭（m/px）</text>

        <!-- N5: 核心指標計算 (focal) -->
        <rect x="620" y="308" width="220" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="628" y="316" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="650" y="325" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CORE</text>
        <text x="730" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">核心指標計算</text>
        <text x="730" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pairs·ttc·pet·chains·events</text>

        <!-- N6: 核心輸出 -->
        <rect x="620" y="420" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="730" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">核心輸出</text>
        <text x="730" y="465" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conflict_events·pet·heatmap</text>

        <!-- N8: 盲區分析 (optional, dashed) -->
        <rect x="620" y="532" width="220" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="628" y="540" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.35"/>
        <text x="644" y="549" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPT</text>
        <text x="730" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">盲區分析</text>
        <text x="730" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blind_area.csv</text>

        <!-- N7: 鳥瞰影片 (optional, dashed) -->
        <rect x="900" y="532" width="220" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="908" y="540" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.35"/>
        <text x="924" y="549" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPT</text>
        <text x="1010" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">鳥瞰影片</text>
        <text x="1010" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bev.mp4 · 5fps</text>

        <!-- ================= LEGEND ================= -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="676" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="60" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">輸入（stage1 軌跡）</text>

        <rect x="300" y="676" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="320" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">焦點（核心指標計算）</text>

        <rect x="580" y="676" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">處理步驟／設定</text>

        <rect x="820" y="676" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.30"/>
        <text x="840" y="685" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">選用（各自開關控制）</text>
      </svg>
