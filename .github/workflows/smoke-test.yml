name: Smoke tests

# Only tests/test_smoke.py runs here. The golden comparison (tests/golden/run_all.sh +
# compare.py) needs dataset/ and models/ from the mounted disk (gitignored, not in this
# checkout) and takes ~16 minutes, so it stays a manual step per CLAUDE.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_smoke.py reads BASE_COMMIT via `git show`, which needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v
