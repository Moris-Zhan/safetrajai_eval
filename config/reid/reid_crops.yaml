# =============================================================================
# config/reid/reid_crops.yaml — Re-ID 訓練資料的裁切蒐集（change rebuild-reid-dataset）
#                          只跑 stage1：在來源資料集 reid_sources 上追蹤並蒐集裁切與 metadata 索引
# 用法：python track_eval.py --config config/reid/reid_crops.yaml
#
# - 只從 reid_sources（role: source）蒐集；評估鏡頭 C000025 一律拒絕。
# - 每支要處理的鏡頭都必須有 config/roi/<camera>.yaml，缺少時在追蹤前報錯（不退回整張影像）。
# - 裁切規則固定在程式中：框中心點需在 ROI 內、最短邊 >= 32px、每條軌跡每 0.5 秒最多 1 張；
#   索引寫到 <reid_crop_dir>/_index/<seq>.csv，索引已存在時報錯（重跑前先移走舊輸出）。
# - 工具模型 yolo11x_dennis.pt@640；追蹤參數以 config/tracking/botsort_noreid.yaml 的 class_tracking 為基礎，
#   四輪車的 center_dist_weight 加重（car 0.6、small_truck／truck／bus 0.4），
#   frame_rate: auto（依影片實際幀率）、gmc_method: sparseOptFlow（ECC 每幀約 0.8～2.5 秒，是 CPU 瓶頸）。
# - 想縮小範圍時，在 paths 加 cameras: [<camera>, ...]（只能取 reid_sources 登記鏡頭的子集）。
# =============================================================================


paths:
  dataset: reid_sources
  TRACKEVAL_OUT_DIR: trackeval_output
  OUTPUT_ROOT: ./runs/track_eval


models:
  det_model_path: ./models/yolo/yolo11x_dennis.pt

trackeval:
  benchmark_name: CCTV
  split_name:     val
  tracker_name:   YOLO11x


# 只跑 stage1（tracking + 裁切蒐集），不需要 stage2 評估（這批來源影片沒有 GT 標註）
stages:
  run_stage1: true
  run_stage2: false

eval_flags:
  run_det_eval:   false
  run_track_eval: true


classes_to_run:
  person:      0
  car:         1
  scooter:     2
  small_truck: 3
  bus:         4
  truck:       5


logging:
  verbose: false
  debug:   false

tracking_params:
  tracker: botsort
  conf:        0.15
  iou:         0.50
  imgsz:       640
  frame_rate:  auto
  gmc_method:  sparseOptFlow

save params:
  show: false
  save: false        # 不需要標註影片
  save_txt: false     # 不需要 YOLO label txt
  show_unmatched: false
  show_removed: false
  save_reid_crops: true
  reid_crop_dir: ./dataset/reid/crops


# -----------------------------------------------------------------------------
# Class-aware tracker 逐類別參數表（BoTSORT，ReID 關閉——跟 config/tracking/botsort_noreid.yaml 相同）
# -----------------------------------------------------------------------------
class_tracking:
  class_names:
    0: person
    1: car
    2: scooter
    3: small_truck
    4: bus
    5: truck

  class_tracking_params:
    car:
      center_dist_weight: 0.6
      fuse_score: true
      match_thresh: 0.7
      new_track_thresh: 0.25
      norm_factor: 80.0
      second_match_thresh: 0.6
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
      track_buffer: 30  # 幀；原 BoTSORT 3.0 × 10fps
    bus:
      center_dist_weight: 0.4
      fuse_score: false
      match_thresh: 0.7
      norm_factor: 200.0
      new_track_thresh: 0.15
      second_match_thresh: 0.55
      unconfirmed_match_thresh: 0.95
      use_reid: false
      proximity_thresh: 0.1
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
      track_buffer: 30  # 幀；原 BoTSORT 3.0 × 10fps
    small_truck:
      center_dist_weight: 0.4
      fuse_score: true
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 30  # 幀；原 BoTSORT 3.0 × 10fps
    truck:
      center_dist_weight: 0.4
      fuse_score: false
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.6
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 30  # 幀；原 BoTSORT 3.0 × 10fps
    person:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.9
      new_track_thresh: 0.25
      norm_factor: 150.0
      second_match_thresh: 0.5
      unconfirmed_match_thresh: 0.85
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.3
      model: models/yolo/yolo11x.pt
      track_buffer: 20  # 幀；原 BoTSORT 2.0 × 10fps
    scooter:
      center_dist_weight: 0.25
      fuse_score: true
      match_thresh: 0.9
      new_track_thresh: 0.1
      norm_factor: 200.0
      second_match_thresh: 0.4
      unconfirmed_match_thresh: 0.8
      use_reid: false
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 20  # 幀；原 BoTSORT 2.0 × 10fps

  default_tracking_params:
    match_thresh: 0.80
    appearance_thresh: 0.35
    new_track_thresh: 0.15
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    use_reid: false
    model: ./yolo11x-cls-reid.pt

  class_conf_thresh:
    person: 0.15
    car: 0.15
    scooter: 0.10
    small_truck: 0.15
    bus: 0.15
    truck: 0.15

  default_conf_thresh: 0.15
