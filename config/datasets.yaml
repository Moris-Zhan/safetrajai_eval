# config/datasets.yaml
# dataset id → 根路徑/子目錄名稱對照表。
# config/*.yaml 的 paths.dataset 欄位用短 id 取代重複的長路徑字面值；
# 詳見 Markdown/config/per-camera-configs.md 第 2 節。
#
# role：eval（附人工 GT、只用於評估）或 source（無人工 GT、用來產生訓練資料），見 CONTEXT.md。
#       eval 與 source 的 cameras 不得重疊（tests/test_smoke.py 檢查）。
# layout：annotated（<root>/<run_det_eval_dir>/annotation_<seq>/<seq>.mp4）
#         或 raw（<root>/<camera>/<seq>.mp4，只探索 cameras 清單內的鏡頭）。
# run_det_eval_dir／run_track_eval_dir：annotated 版面的來源子目錄名稱，也是 OUTPUT_ROOT 下的輸出子目錄名稱。

datasets:
  cctv_all8:
    root: "./dataset/eval/cctv_all8/"
    role: eval
    layout: annotated
    cameras: [C000025]
    run_det_eval_dir: annotations_all8
    run_track_eval_dir: mot_annotations_all8
  reid_sources:
    root: "./dataset/raw/videos/"
    role: source
    layout: raw
    # C000026 與評估鏡頭 C000025 位於同一路口，影片歸位在 dataset/raw/videos/C000026/，
    # 但不列入本資料集，避免 Re-ID 在 C000025 的驗收偏樂觀（2026-09-24 使用者決定）。
    cameras: [C000011, C000012, C000033, C000043, C000048, C000054, C000056, C000085, C000256]
    run_det_eval_dir: annotations_video
    run_track_eval_dir: mot_annotations_video
