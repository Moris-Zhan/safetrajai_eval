# =============================================================================
# config/botsort_reid.yaml — 情境 4：BoTSORT + ReID 開啟，完整流程
#                             （stage1 tracking + stage2 TrackEval 評估）
# 用法：python track_eval.py --config config/botsort_reid.yaml
# 內容原為舊版 tracker 目錄下的 track_config_BotSort_0413.yaml，已合併進本檔。
# 這是 scripts/grid_search_botsort_reid.py 的 PARAM_GRIDS 固定值
# 對照的原始版本（該腳本註解明確標示與此版本一致）。
# =============================================================================


paths:
  dataset: cctv_all8
  TRACKEVAL_OUT_DIR: trackeval_output
  OUTPUT_ROOT: ./runs/track_eval


models:
  det_model_path: ./models/yolo/yolo11x_dennis.pt

trackeval:
  benchmark_name: CCTV
  split_name:     val
  tracker_name:   YOLO11x


stages:
  run_stage1: true
  run_stage2: true

eval_flags:
  run_det_eval:   false
  run_track_eval: true


classes_to_run:
  person:      0
  car:         1
  scooter:     2
  small_truck: 3
  bus:         4
  truck:       5


det_corner:
  - [210, 90]
  - [580, 100]
  - [640, 320]
  - [0,   280]

logging:
  verbose: false
  debug:   false

tracking_params:
  tracker: botsort
  conf:        0.15
  iou:         0.50
  imgsz:       640
  frame_rate:  30
  gmc_method:  ecc

save params:
  show: false
  save: true
  save_txt: true
  show_unmatched: false
  show_removed: false
  save_reid_crops: false
  reid_crop_dir: ./dataset/reid/crop_dataset


# -----------------------------------------------------------------------------
# Class-aware tracker 逐類別參數表（BoTSORT，ReID 全部開啟）
# 這裡沒有 track_buffer 欄位（跟原始 track_config_BotSort_0413.yaml 一致），
# 各類別 lost track 存活時間會回落全域預設 self.max_time_lost。
# -----------------------------------------------------------------------------
class_tracking:
  class_names:
    0: person
    1: car
    2: scooter
    3: small_truck
    4: bus
    5: truck

  class_tracking_params:
    car:
      center_dist_weight: 0.4
      fuse_score: true
      match_thresh: 0.7
      new_track_thresh: 0.25
      norm_factor: 80.0
      second_match_thresh: 0.6
      unconfirmed_match_thresh: 0.9
      use_reid: true
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
    bus:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.7
      norm_factor: 200.0
      new_track_thresh: 0.15
      second_match_thresh: 0.55
      unconfirmed_match_thresh: 0.95
      use_reid: true
      proximity_thresh: 0.1
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
    small_truck:
      center_dist_weight: 0.2
      fuse_score: true
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: true
      proximity_thresh: 0.3
      appearance_thresh: 0.1
      model: models/yolo-reid/yolo11x-reid-ultra.pt
    truck:
      center_dist_weight: 0.2
      fuse_score: false
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: true
      proximity_thresh: 0.6
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
    person:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.9
      new_track_thresh: 0.25
      norm_factor: 150.0
      second_match_thresh: 0.5
      unconfirmed_match_thresh: 0.85
      use_reid: true
      proximity_thresh: 0.3
      appearance_thresh: 0.3
      model: models/yolo/yolo11x.pt
    scooter:
      center_dist_weight: 0.25
      fuse_score: true
      match_thresh: 0.9
      new_track_thresh: 0.1
      norm_factor: 200.0
      second_match_thresh: 0.4
      unconfirmed_match_thresh: 0.8
      use_reid: true
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo-reid/yolo11x-reid-ultra.pt

  default_tracking_params:
    match_thresh: 0.80
    appearance_thresh: 0.35
    new_track_thresh: 0.15
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    use_reid: true
    model: ./yolo11x-cls-reid.pt

  class_conf_thresh:
    person: 0.15
    car: 0.15
    scooter: 0.10
    small_truck: 0.15
    bus: 0.15
    truck: 0.15

  default_conf_thresh: 0.15
