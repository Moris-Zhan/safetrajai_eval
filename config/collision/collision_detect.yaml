# =============================================================================
# config/collision/collision_detect.yaml — 骨架：BoTSORT 追蹤 + 軌跡碰撞偵測（TTC/PET）
#                                （stage1 tracking + stage3 collision detection，stage2 TrackEval 關閉）
# 用法：python track_eval.py --config config/collision/collision_detect.yaml
#
# 追蹤參數沿用 config/tracking/botsort_noreid.yaml（BoTSORT、ReID 關閉）——碰撞偵測只需要
# 追蹤產生的軌跡檔（格式見 Markdown/pipeline/main-flow.md），不需要 TrackEval 評估，
# 所以關閉 stage2、開啟 stage3。
#
# stage3（TrackingEvalPipeline.run_stage3()，見 track_eval.py / safetrajai/collision/）
# 讀取 stage1 產生的逐類別軌跡檔，計算 TTC（Time-To-Collision）/ PET
# （Post-Encroachment Time）碰撞事件，輸出到 collision: 區塊指定的目錄。
# =============================================================================


paths:
  dataset: cctv_all8
  TRACKEVAL_OUT_DIR: trackeval_output
  COLLISION_OUT_DIR: collision_output
  OUTPUT_ROOT: ./runs/track_eval


models:
  det_model_path: ./models/yolo/yolo11x_dennis.pt

trackeval:
  benchmark_name: CCTV
  split_name:     val
  tracker_name:   YOLO11x


stages:
  run_stage1: true
  run_stage2: false
  run_stage3: true

eval_flags:
  run_det_eval:   false
  run_track_eval: true


# -----------------------------------------------------------------------------
# 碰撞偵測參數（safetrajai/collision/，見 Markdown/config/collision-configs.md）
# -----------------------------------------------------------------------------
collision:
  # 鏡頭鍵的 Homography 設定（<camera>.yaml，見 safetrajai/collision/homography/camera_config.py）；
  # 鏡頭沒有設定檔時，該鏡頭的序列退回原始像素座標
  homography_camera_dir: config/homography

  # TTC（Time-To-Collision）參數，見 Markdown/config/collision-configs.md 第 3 節
  max_ttc_frames: 30      # 模擬時間上限（frame 數）；SafeTrajAI 主流程原本掃 15/30/45/60，這裡先固定一組
  iou_threshold: 0.8      # 判定為碰撞的邊界框 IoU 門檻（原始程式預設值）

  # PET（Post-Encroachment Time）參數，見 Markdown/config/collision-configs.md 第 3 節
  lookback_sec: 3.0       # 允許比對的最大時間差（秒）；SafeTrajAI 主流程原本掃 2.0~4.5，這裡先固定一組
  # ⚠️ 原始程式 overlap_threshold 預設 0.2 是校準給 Homography 轉換後地圖座標系用的門檻值；
  # 本專案沒有 homography 對應點時會退回原始像素座標，量級完全不同，這裡先給一個像素尺度的
  # 起始值，還沒用實際資料驗證過，之後要依實測結果調整
  overlap_threshold: 30.0


classes_to_run:
  person:      0
  car:         1
  scooter:     2
  small_truck: 3
  bus:         4
  truck:       5


logging:
  verbose: false
  debug:   false

tracking_params:
  tracker: botsort
  conf:        0.15
  iou:         0.50
  imgsz:       640
  frame_rate:  30
  gmc_method:  ecc

save params:
  show: false
  save: false
  save_txt: true
  show_unmatched: false
  show_removed: false
  save_reid_crops: false
  reid_crop_dir: ./dataset/reid/crops


# -----------------------------------------------------------------------------
# Class-aware tracker 逐類別參數表（沿用 config/tracking/botsort_noreid.yaml，BoTSORT、ReID 全部關閉）
# -----------------------------------------------------------------------------
class_tracking:
  class_names:
    0: person
    1: car
    2: scooter
    3: small_truck
    4: bus
    5: truck

  class_tracking_params:
    car:
      center_dist_weight: 0.4
      fuse_score: true
      match_thresh: 0.7
      new_track_thresh: 0.25
      norm_factor: 80.0
      second_match_thresh: 0.6
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
      track_buffer: 90  # 幀；原 BoTSORT 3.0 × 30fps
    bus:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.7
      norm_factor: 200.0
      new_track_thresh: 0.15
      second_match_thresh: 0.55
      unconfirmed_match_thresh: 0.95
      use_reid: false
      proximity_thresh: 0.1
      appearance_thresh: 0.1
      model: models/yolo/yolo11x_dennis.pt
      track_buffer: 90  # 幀；原 BoTSORT 3.0 × 30fps
    small_truck:
      center_dist_weight: 0.2
      fuse_score: true
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 90  # 幀；原 BoTSORT 3.0 × 30fps
    truck:
      center_dist_weight: 0.2
      fuse_score: false
      match_thresh: 0.6
      norm_factor: 100.0
      new_track_thresh: 0.15
      second_match_thresh: 0.45
      unconfirmed_match_thresh: 0.9
      use_reid: false
      proximity_thresh: 0.6
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 90  # 幀；原 BoTSORT 3.0 × 30fps
    person:
      center_dist_weight: 0.25
      fuse_score: false
      match_thresh: 0.9
      new_track_thresh: 0.25
      norm_factor: 150.0
      second_match_thresh: 0.5
      unconfirmed_match_thresh: 0.85
      use_reid: false
      proximity_thresh: 0.3
      appearance_thresh: 0.3
      model: models/yolo/yolo11x.pt
      track_buffer: 60  # 幀；原 BoTSORT 2.0 × 30fps
    scooter:
      center_dist_weight: 0.25
      fuse_score: true
      match_thresh: 0.9
      new_track_thresh: 0.1
      norm_factor: 200.0
      second_match_thresh: 0.4
      unconfirmed_match_thresh: 0.8
      use_reid: false
      proximity_thresh: 0.5
      appearance_thresh: 0.1
      model: models/yolo/yolo11x.pt
      track_buffer: 60  # 幀；原 BoTSORT 2.0 × 30fps

  default_tracking_params:
    match_thresh: 0.80
    appearance_thresh: 0.35
    new_track_thresh: 0.15
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    use_reid: false
    model: ./yolo11x-cls-reid.pt

  class_conf_thresh:
    person: 0.15
    car: 0.15
    scooter: 0.10
    small_truck: 0.15
    bus: 0.15
    truck: 0.15

  default_conf_thresh: 0.15
