# Class-aware tracker 設定（原 trackers/config.py 內容）
# 由 trackers.config.load_track_config() 載入；CLI 使用 --track-config 指定路徑

class_names:
  0: person
  1: car
  2: scooter
  3: small_truck
  4: bus
  5: truck

# 各類別追蹤參數（鍵為類別英文名，與 class_names 值一致）
class_tracking_params:
  car:
    center_dist_weight: 0.4
    fuse_score: true
    match_thresh: 0.7
    new_track_thresh: 0.25
    norm_factor: 80.0
    second_match_thresh: 0.6
    unconfirmed_match_thresh: 0.9
    use_reid: false
    proximity_thresh: 0.5
    appearance_thresh: 0.1
    model: models/yolo/yolo11x_dennis.pt
    track_buffer: 2.0
  bus:
    center_dist_weight: 0.25
    fuse_score: false
    match_thresh: 0.7
    norm_factor: 200.0
    new_track_thresh: 0.15
    second_match_thresh: 0.55
    unconfirmed_match_thresh: 0.95
    use_reid: false
    proximity_thresh: 0.1
    appearance_thresh: 0.1
    model: models/yolo/yolo11x_dennis.pt
    track_buffer: 2.0
  small_truck:
    center_dist_weight: 0.2
    fuse_score: true
    match_thresh: 0.6
    norm_factor: 100.0
    new_track_thresh: 0.15
    second_match_thresh: 0.45
    unconfirmed_match_thresh: 0.9
    use_reid: false
    proximity_thresh: 0.3
    appearance_thresh: 0.1
    model: models/yolo-reid/yolo11x-reid-ultra.pt
    track_buffer: 2.0
  truck:
    center_dist_weight: 0.2
    fuse_score: false
    match_thresh: 0.6
    norm_factor: 100.0
    new_track_thresh: 0.15
    second_match_thresh: 0.45
    unconfirmed_match_thresh: 0.9
    use_reid: false
    proximity_thresh: 0.6
    appearance_thresh: 0.1
    model: models/yolo/yolo11x.pt
    track_buffer: 2.0
  person:
    center_dist_weight: 0.25
    fuse_score: false
    match_thresh: 0.9
    new_track_thresh: 0.25
    norm_factor: 150.0
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.85
    use_reid: false
    proximity_thresh: 0.3
    appearance_thresh: 0.3
