<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3欄2列影片 + 共用控制 + 同步播放</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 20px;
            width: 95%;
        }

        .video-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        video {
            width: 100%;
            height: 35vh;
            object-fit: contain;
            background-color: #111;
        }

        .video-title {
            margin-top: 10px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            text-align: center;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 14px 22px;
            font-size: 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="video-item">
            <video id="video1" muted>
                <source src="../C000025_clip_6_15-det.mp4" type="video/mp4">
            </video>
            <div class="video-title">det 結果</div>
        </div>
        <div class="video-item">
            <video id="video1" muted>
                <source src="../runs/margin-arcface/train-001/C000025_clip_6_15.mp4" type="video/mp4">
            </video>
            <div class="video-title">arcface 結果</div>
        </div>

        <div class="video-item">
            <video id="video2" muted>
                <source src="../runs/margin-cosface/train-001/C000025_clip_6_15.mp4" type="video/mp4">
            </video>
            <div class="video-title">cosface 結果</div>
        </div>

        <div class="video-item">
            <video id="video3" muted>
                <source src="../runs/margin-adaface/train-001/C000025_clip_6_15.mp4" type="video/mp4">
            </video>
            <div class="video-title">adaface 結果</div>
        </div>

        <div class="video-item">
            <video id="video4" muted>
                <source src="../runs/margin-sphereface/train-002/C000025_clip_6_15.mp4" type="video/mp4">
            </video>
            <div class="video-title">sphereface 結果</div>
        </div>

        <div class="video-item">
            <video id="video5" muted>
                <source src="../runs/margin-triplet/train-001/C000025_clip_6_15.mp4" type="video/mp4">
            </video>
            <div class="video-title">Margin + Triplet 結果</div>
        </div>

    </div>

    <div class="controls">
        <button onclick="setPlaybackRate(0.5)">慢速 (0.5x)</button>
        <button onclick="setPlaybackRate(1)">正常 (1x)</button>
        <button onclick="setPlaybackRate(4)">超快進 (4x)</button>
        <button onclick="rewindSeconds(5)">倒退 5 秒</button>
        <button onclick="forwardSeconds(5)">快進 5 秒</button>
        <button onclick="toggleSyncPlay()">同步播放 / 暫停</button>
    </div>

    <script>
        // 🔥 自動抓全部影片（未來新增不用改）
        const videos = Array.from(document.querySelectorAll("video"));

        function setPlaybackRate(rate) {
            videos.forEach(video => video.playbackRate = rate);
        }

        function rewindSeconds(seconds) {
            videos.forEach(video => {
                video.currentTime = Math.max(video.currentTime - seconds, 0);
            });
        }

        function forwardSeconds(seconds) {
            videos.forEach(video => {
                video.currentTime = Math.min(video.currentTime + seconds, video.duration);
            });
        }

        function toggleSyncPlay() {
            const allPaused = videos.every(video => video.paused);

            if (allPaused) {
                videos.forEach(video => video.play());
            } else {
                videos.forEach(video => video.pause());
            }
        }
    </script>

</body>
</html>
